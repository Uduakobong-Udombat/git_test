name: Build LessonBell Wear OS APK
on:
  push:
    branches: [lessonbell-wearos-v1]
    paths:
      - 'lessonbell/source.tar.xz'
      - 'LessonBell/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'lessonbell/source.tar.xz'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check timetable fixture
        run: python3 LessonBell/tests/check_seed.py
      - name: Check Google Calendar integration wiring
        run: python3 LessonBell/tests/check_google_sync.py
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: LessonBell
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Print APK signing SHA-1 for Google Cloud OAuth setup
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs LessonBell/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK exists
        run: test -s LessonBell/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LessonBell-WearOS-v1.1-debug-APK
          path: LessonBell/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
