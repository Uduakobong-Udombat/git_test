plugins { id 'com.android.application' }

def signingKeyFile = System.getenv('LESSONBELL_KEYSTORE_PATH')
def signingPassword = System.getenv('LESSONBELL_STORE_PASSWORD')

android {
    namespace 'com.lessonbell.watch'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lessonbell.watch'
        minSdk 30
        targetSdk 34
        versionCode 5
        versionName '1.3.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

    // Both variants are signed using the SAME permanent certificate.
    // Keystore and password are provided at runtime through GitHub Actions secrets.
    signingConfigs {
        permanent {
            if (signingKeyFile && signingPassword) {
                storeFile file(signingKeyFile)
                storePassword signingPassword
                keyAlias 'lessonbell'
                keyPassword signingPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.permanent
            debuggable false
            minifyEnabled false
        }
        migration {
            initWith release
            signingConfig signingConfigs.permanent
            debuggable true
            matchingFallbacks = ['release']
        }
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-auth:22.0.0"
    implementation "androidx.wear.tiles:tiles:1.6.2"
    implementation "androidx.wear.protolayout:protolayout:1.4.2"
    implementation "com.google.guava:guava:33.4.8-android"
}
