plugins { id 'com.android.application' }

android {
    namespace 'com.champagneatelier.watchx'
    compileSdk 35

    defaultConfig {
        applicationId 'com.champagneatelier.watchx'
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false; shrinkResources false }
    }
}
