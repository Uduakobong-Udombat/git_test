name: LessonBell permanent-signing release

on:
  push:
    branches: [lessonbell-release]
    paths:
      - 'LessonBell/**'
      - 'lessonbell/release-request.txt'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check timetable, calendar sync, tiles, and signing
        run: |
          python3 LessonBell/tests/check_seed.py
          python3 LessonBell/tests/check_google_sync.py
          python3 LessonBell/tests/check_tiles.py
          python3 LessonBell/tests/check_signing.py
      - name: Provision Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile validation-only build
        working-directory: LessonBell
        run: gradle --no-daemon assembleDebug

  release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'Trigger signed LessonBell release') }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LESSONBELL_KEYSTORE_B64: ${{ secrets.LESSONBELL_KEYSTORE_B64 }}
      LESSONBELL_STORE_PASSWORD: ${{ secrets.LESSONBELL_STORE_PASSWORD }}
      LESSONBELL_CERT_SHA1: ${{ secrets.LESSONBELL_CERT_SHA1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Provision Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Load private signing key (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$LESSONBELL_KEYSTORE_B64" || -z "$LESSONBELL_STORE_PASSWORD" || -z "$LESSONBELL_CERT_SHA1" ]]; then
            echo 'Permanent signing secrets missing. Run the one-time Mac signing setup script.' >&2
            exit 1
          fi
          echo "LESSONBELL_KEYSTORE_PATH=$RUNNER_TEMP/lessonbell-release.p12" >> "$GITHUB_ENV"
          printf '%s' "$LESSONBELL_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lessonbell-release.p12"
          chmod 600 "$RUNNER_TEMP/lessonbell-release.p12"
          test -s "$RUNNER_TEMP/lessonbell-release.p12"
          keytool -list -alias lessonbell -keystore "$RUNNER_TEMP/lessonbell-release.p12" -storepass "$LESSONBELL_STORE_PASSWORD" >/dev/null
      - name: Build permanently signed migration and release APKs
        working-directory: LessonBell
        run: gradle --no-daemon assembleMigration assembleRelease
      - name: Verify both APKs use the SAME permanent certificate
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          EXPECTED=$(printf '%s' "$LESSONBELL_CERT_SHA1" | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')
          test "${#EXPECTED}" -eq 40
          for FILE in \
            LessonBell/app/build/outputs/apk/migration/app-migration.apk \
            LessonBell/app/build/outputs/apk/release/app-release.apk; do
            test -s "$FILE"
            "$TOOL" verify --verbose "$FILE" >/dev/null
            ACTUAL=$("$TOOL" verify --print-certs "$FILE" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1 | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')
            if [[ "$ACTUAL" != "$EXPECTED" ]]; then
              echo "Signing fingerprint mismatch: $FILE" >&2
              exit 1
            fi
          done
          mkdir -p signed-apks
          cp LessonBell/app/build/outputs/apk/migration/app-migration.apk signed-apks/LessonBell-v1.3.1-migration.apk
          cp LessonBell/app/build/outputs/apk/release/app-release.apk signed-apks/LessonBell-v1.3.1-release.apk
          echo "$LESSONBELL_CERT_SHA1" > signed-apks/OAuth-SHA1.txt
      - name: Upload permanently signed APK pair
        uses: actions/upload-artifact@v4
        with:
          name: LessonBell-v1.3.1-PERMANENTLY-SIGNED
          path: signed-apks/*
          retention-days: 90
      - name: Remove private keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/lessonbell-release.p12"
