plugins { id 'com.android.application' }

android {
    namespace 'com.champagneatelier.watchx'
    compileSdk 35

    defaultConfig {
        applicationId 'com.champagneatelier.watchx.v2'
        minSdk 33
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false; shrinkResources false }
    }
}
