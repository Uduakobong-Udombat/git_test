name: Build LessonBell Wear OS APK
on:
  push:
    branches: [lessonbell-wearos-v1, main]
    paths:
      - 'lessonbell/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'lessonbell/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: lessonbell
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK exists
        run: test -s lessonbell/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LessonBell-WearOS-v1-debug-APK
          path: lessonbell/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
