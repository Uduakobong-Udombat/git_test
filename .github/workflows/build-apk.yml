name: Build LessonBell Wear OS APK
on:
  push:
    branches: [lessonbell-wearos-v1]
    paths:
      - 'lessonbell/source.tar.xz'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'lessonbell/source.tar.xz'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Expand project sources
        run: tar -xJf lessonbell/source.tar.xz
      - name: Check timetable fixture
        run: python3 LessonBell/tests/check_seed.py
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: LessonBell
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK exists
        run: test -s LessonBell/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LessonBell-WearOS-v1-debug-APK
          path: LessonBell/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish unpacked editable source files
        if: github.event_name == 'push' && github.ref == 'refs/heads/lessonbell-wearos-v1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LessonBell
          if ! git diff --cached --quiet; then
            git commit -m 'Publish editable LessonBell app source [skip ci]'
            git push
          fi
